# Settings for the local RAG prototype.
# Every key is required and unknown keys are rejected, so a typo fails loudly.
# Relative paths are resolved against the folder that contains this file.

[paths]
docs_dir = "data/docs"                     # the PDFs and markdown files to index
index_dir = "index"                        # chromadb files: one collection per chunking strategy
questions_csv = "data/eval/questions.csv"  # test set: id, question, expected_doc
results_dir = "results"                    # evaluation and answer CSVs

[ollama]
host = "http://127.0.0.1:11434"
embed_model = "nomic-embed-text"
chat_model = "llama3.2:3b"
timeout_s = 120     # per request; the first request also loads the model into memory
keep_alive = "10m"  # how long Ollama keeps a model loaded after a request (its default: 5m)

[ingest]
batch_size = 32     # chunks per embedding request

[retrieval]
top_k = 4           # chunks given to the chat model (charter: 3-5)
eval_k = 3          # hit-rate cut-off: is the right document among the top 3 chunks?
